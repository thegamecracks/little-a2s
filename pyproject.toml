[build-system]
requires = ["uv-build~=0.11.8"]
build-backend = "uv_build"

[project]
name = "little-a2s"
version = "0.7.2"
description = "A sync + async + sans-I/O library for the Valve Source Query (A2S) protocol."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "thegamecracks" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: SQL",
    "Topic :: Internet",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
keywords = [
    "a2s",
    "asyncio",
    "query",
    "sansio",
    "source",
    "source query",
    "steam",
    "steam query",
    "valve",
    "valve source query",
]
dependencies = []

[dependency-groups]
dev = [
    "coverage~=7.11",
    "pytest~=9.0",
]
docs = [
    "sphinx~=9.0",
    "sphinx-autodoc-typehints~=3.6",
    "sphinx-book-theme~=1.2",
]

[project.urls]
# https://packaging.python.org/en/latest/specifications/well-known-project-urls/#well-known-labels
Homepage = "https://little-a2s.rtfd.io/"
Documentation = "https://little-a2s.rtfd.io/"
GitHub = "https://github.com/thegamecracks/little-a2s"
Issues = "https://github.com/thegamecracks/little-a2s/issues"

[tool.pytest]
addopts = ["--import-mode=importlib"]

[tool.uv]
default-groups = "all"
